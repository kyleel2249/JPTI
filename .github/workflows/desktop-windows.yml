name: Windows desktop installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'desktop/**'
      - 'integrations/t-bots/public/**'
      - 'package.json'
      - '.github/workflows/desktop-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable app
        run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: jpti-windows-desktop
          path: release/*.exe
          if-no-files-found: error
